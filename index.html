<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八重山・宮古諸島ガイド</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    img {
      max-width: 100%;
      border-radius: 16px;
      display: block;
      margin: 10px 0;
    }
    .map-img, .sponsor-img {
      max-height: 180px;
      object-fit: contain;
    }
    button {
      background: #2c6e9e;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      cursor: pointer;
    }
    .sponsor {
      text-align: center;
      background: #e9ecef;
      border-radius: 20px;
      padding: 15px;
      margin: 20px 0;
    }
    hr {
      margin: 20px 0;
    }
  </style>
</head>
<body>

<h1>🌊 八重山・宮古諸島ガイド</h1>

<!-- スポンサー上部 -->
<div class="sponsor" id="sponsorTop"></div>

<!-- 石垣島 -->
<div class="card" id="ishigaki-card">
  <h2>石垣島</h2>
  <img id="ishigakiMainImg" src="" alt="石垣島メイン画像">
  <p id="ishigakiDesc">八重山の玄関口、美しいビーチと山々。</p>
  <div class="map">
    <img id="ishigakiMap" class="map-img" src="" alt="石垣島地図">
  </div>
  <a id="ishigakiOfficial" href="#" target="_blank">公式サイト</a><br>
  <button onclick="showDetail('ishigaki')">詳細を見る</button>
</div>

<!-- 宮古島 -->
<div class="card" id="miyako-card">
  <h2>宮古島</h2>
  <img id="miyakoMainImg" src="" alt="宮古島メイン画像">
  <p id="miyakoDesc">サンゴ礁の楽園、透き通る海。</p>
  <div class="map">
    <img id="miyakoMap" class="map-img" src="" alt="宮古島地図">
  </div>
  <a id="miyakoOfficial" href="#" target="_blank">公式サイト</a><br>
  <button onclick="showDetail('miyako')">詳細を見る</button>
</div>

<!-- 周辺島へのリンク -->
<div style="text-align:center; margin:20px 0;">
  <button onclick="showNearby('yaeyama')">🏝️ 石垣島周辺の島々（八重山）</button>
  <button onclick="showNearby('miyako')">🏝️ 宮古島周辺の島々</button>
</div>

<!-- 周辺島リスト表示エリア -->
<div id="nearbyArea" style="display:none;"></div>

<!-- 詳細表示エリア -->
<div id="detailArea" style="display:none;"></div>

<!-- スポンサー下部 -->
<div class="sponsor" id="sponsorBottom"></div>

<footer>
  <p>Contact us<br><a href="mailto:mementomorikatsu@gmail.com">mementomorikatsu@gmail.com</a></p>
</footer>

<script>
  // =====================================================
  // ★ あなたが設定するURL（ここだけ書き換えてください） ★
  // =====================================================
  const MY_URLS = {
    // スポンサー
    sponsorImg: "https://www.euglena.jp/wp_01/wp-content/uploads/2023/10/efd456796c829c131a17e6e6526cbc82.png",
    sponsorLink: "https://www.euglena.jp/",
    
    // 石垣島
    ishigakiMainImg: "https://ishigaki-tours.com/wp-content/uploads/2018/01/313-3.jpg",
    ishigakiMapImg: "https://www.samuraitours.com/wp-content/uploads/2020/05/e_top_map.gif",
    ishigakiOfficial: "https://visitokinawa.jp/",
    
    // 宮古島
    miyakoMainImg: "https://www.veltra.com/jp/guide/wp-content/uploads/2023/10/pixta_39456562_M-min.jpg",
    miyakoMapImg: "https://i0.wp.com/perfect47japan.com/wp-content/uploads/2023/06/Glory-Island-33.jpg?resize=1024%2C683&ssl=1",
    miyakoOfficial: "https://www.miyakotravel.jp/"
  };
  // =====================================================

  // ページ読み込み時に画像・リンクをセット
  document.getElementById("sponsorTop").innerHTML = `<img src="${MY_URLS.sponsorImg}" style="max-height:80px"><br><a href="${MY_URLS.sponsorLink}" target="_blank">${MY_URLS.sponsorLink}</a>`;
  document.getElementById("sponsorBottom").innerHTML = `<img src="${MY_URLS.sponsorImg}" style="max-height:80px"><br><a href="${MY_URLS.sponsorLink}" target="_blank">スポンサーサイトへ</a>`;
  
  document.getElementById("ishigakiMainImg").src = MY_URLS.ishigakiMainImg;
  document.getElementById("ishigakiMap").src = MY_URLS.ishigakiMapImg;
  document.getElementById("ishigakiOfficial").href = MY_URLS.ishigakiOfficial;
  
  document.getElementById("miyakoMainImg").src = MY_URLS.miyakoMainImg;
  document.getElementById("miyakoMap").src = MY_URLS.miyakoMapImg;
  document.getElementById("miyakoOfficial").href = MY_URLS.miyakoOfficial;

  // 周辺島データ（シンプルに）
  const nearbyData = {
    yaeyama: {
      title: "八重山諸島",
      list: [
        { name: "西表島", desc: "マングローブカヤック、西表山猫。", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Iriomote_Island_View.jpg/640px-Iriomote_Island_View.jpg" },
        { name: "竹富島", desc: "水牛車、赤瓦の集落。", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Taketomi_Island_buffalo_cart.jpg/640px-Taketomi_Island_buffalo_cart.jpg" },
        { name: "小浜島", desc: "サトウキビ畑、のどかな島。", img: "https://upload.wikimedia.org/wikipedia/commons/1/1f/Kohama_Island_01.jpg" },
        { name: "黒島", desc: "牛と星空の島。", img: "https://upload.wikimedia.org/wikipedia/commons/0/0f/Kuroshima_Island_-_pasture.jpg" },
        { name: "鳩間島", desc: "小さな離島、絶景の夕日。", img: "https://upload.wikimedia.org/wikipedia/commons/9/95/Hatoma_Island.jpg" }
      ]
    },
    miyako: {
      title: "宮古諸島",
      list: [
        { name: "伊良部島", desc: "伊良部大橋、絶景。", img: "https://upload.wikimedia.org/wikipedia/commons/f/fb/Irabu_Ohashi_Bridge.jpg" },
        { name: "下地島", desc: "透明度抜群、飛行機展望。", img: "https://upload.wikimedia.org/wikipedia/commons/0/0c/Shimoji_Island_airport.jpg" },
        { name: "池間島", desc: "牧歌的風景、星空観測。", img: "https://upload.wikimedia.org/wikipedia/commons/8/87/Ikema_Island_Ohashi.jpg" },
        { name: "来間島", desc: "パノラマ展望の小島。", img: "https://upload.wikimedia.org/wikipedia/commons/6/6a/Kurima_Bridge.jpg" }
      ]
    }
  };

  function showNearby(group) {
    const data = nearbyData[group];
    if (!data) return;
    let html = `<div class="card"><button onclick="hideNearby()">戻る</button><h2>${data.title}</h2>`;
    data.list.forEach(item => {
      html += `<div style="border-bottom:1px solid #ccc; padding:10px;">
                  <h3>${item.name}</h3>
                  <img src="${item.img}" style="max-height:150px">
                  <p>${item.desc}</p>
                </div>`;
    });
    html += `</div>`;
    document.getElementById("nearbyArea").innerHTML = html;
    document.getElementById("nearbyArea").style.display = "block";
    document.getElementById("detailArea").style.display = "none";
    document.querySelector(".card-grid")?.remove();
  }

  function hideNearby() {
    document.getElementById("nearbyArea").style.display = "none";
  }

  function showDetail(area) {
    let html = "";
    if (area === "ishigaki") {
      html = `<div class="card"><button onclick="hideDetail()">戻る</button>
              <h2>石垣島 詳細</h2>
              <img src="${MY_URLS.ishigakiMainImg}">
              <p>川平湾、野底岳、やいま村など。レンタカーが便利。</p>
              <a href="${MY_URLS.ishigakiOfficial}" target="_blank">公式サイト</a>
              </div>`;
    } else if (area === "miyako") {
      html = `<div class="card"><button onclick="hideDetail()">戻る</button>
              <h2>宮古島 詳細</h2>
              <img src="${MY_URLS.miyakoMainImg}">
              <p>与那覇前浜ビーチ、東平安名崎。シュノーケリングにおすすめ。</p>
              <a href="${MY_URLS.miyakoOfficial}" target="_blank">公式サイト</a>
              </div>`;
    }
    document.getElementById("detailArea").innerHTML = html;
    document.getElementById("detailArea").style.display = "block";
    document.getElementById("nearbyArea").style.display = "none";
  }

  function hideDetail() {
    document.getElementById("detailArea").style.display = "none";
  }
</script>
</body>
</html>
