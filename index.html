<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Yaeyama & Miyako Guide</title>
  
  <!-- PWA + iPhone 対応 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e2a3a">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body.dark {
      --bg: #121212;
      --surface: #1e2a3a;
      --text: #eef2f5;
      --text-light: #b0c4de;
      --border: #2d3e4e;
      --card: #1e2a3a;
      --btn: #2c6e9e;
      --btn-hover: #1e4f73;
    }
    body.light {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --text: #1e2a3a;
      --text-light: #2c3e50;
      --border: #ccd7e4;
      --card: #ffffff;
      --btn: #2c6e9e;
      --btn-hover: #1e4f73;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      padding: 16px;
      transition: background 0.2s, color 0.2s;
    }

    header, footer {
      background: var(--surface);
      border-radius: 28px;
      padding: 16px 20px;
      margin: 16px 0;
      border: 1px solid var(--border);
    }

    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    h2 { margin: 20px 0 12px; font-size: 1.4rem; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      background: var(--btn);
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      color: white;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--btn-hover); }

    .sponsor {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 24px;
      padding: 16px;
      margin: 20px 0;
      text-align: center;
    }
    .sponsor img { max-height: 80px; max-width: 100%; border-radius: 12px; }
    .sponsor a { color: #4a9eff; text-decoration: none; word-break: break-all; }

    .card-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin: 20px 0;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 20px;
      width: 340px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-5px); }
    .card-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 20px;
      margin: 12px 0;
    }
    .card h3 { font-size: 1.4rem; }

    .map {
      margin: 16px 0;
      border-radius: 16px;
      overflow: hidden;
      height: 180px;
      background: var(--bg);
    }
    .map iframe { width: 100%; height: 100%; border: none; }
    .map-placeholder {
      background: var(--btn);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.9rem;
      text-align: center;
      padding: 12px;
    }

    .detail-view {
      background: var(--card);
      border-radius: 32px;
      padding: 24px;
      max-width: 700px;
      margin: 0 auto;
    }
    .detail-img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 24px;
      margin: 16px 0;
    }
    .back-btn { margin: 20px 0 10px; }

    .island-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 500px;
      margin: 20px auto;
    }
    .list-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 60px;
      padding: 14px 20px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
    }
    footer p { margin: 8px 0; }
    footer a { color: var(--text-light); text-decoration: none; }
    hr { border-color: var(--border); margin: 20px 0; }
  </style>
</head>

  function getName(obj, fallback) { return obj[lang] || obj.en || fallback; }

  // ★ 周辺島用のテキスト取得ヘルパー
  function getNearbyText(item, field) {
    if (!item) return "";
    const fieldMap = {
      desc: { en: item.descEn, ja: item.descJa, it: item.descIt, ru: item.descRu },
      access: { en: item.accessEn, ja: item.accessJa, it: item.accessEn, ru: item.accessEn },
      sights: { en: item.sightsEn, ja: item.sightsJa, it: item.sightsEn, ru: item.sightsEn },
      tips: { en: item.tipsEn, ja: item.tipsJa, it: item.tipsEn, ru: item.tipsEn }
    };
    const target = fieldMap[field];
    if (!target) return "";
    return target[lang] || target.en || "";
  }

  function updateSponsors() {
    const hasSponsor = SPONSOR_IMG_URL && SPONSOR_LINK_URL;
    const content = hasSponsor 
      ? `<img src="${SPONSOR_IMG_URL}" alt="sponsor"><br><a href="${SPONSOR_LINK_URL}" target="_blank" rel="noopener">${SPONSOR_LINK_URL}</a>`
      : t("sponsorDefault");
    document.getElementById("sponsorTop").innerHTML = content;
    document.getElementById("sponsorBottom").innerHTML = content;
  }

  // メインページ
  function renderMain() {
    const app = document.getElementById("app");
    app.innerHTML = `
      <h2>${t("mainTitle")}</h2>
      <div class="card-grid">
        <div class="card" data-id="ishigaki">
          <h3>${getName(mainIslands.ishigaki.name)}</h3>
          <img class="card-img" src="${mainIslands.ishigaki.image}" onerror="this.src='https://placehold.co/600x300'">
          <p>${getName(mainIslands.ishigaki.desc)}</p>
          <div class="map">${ISHIGAKI_MAP_URL ? `<iframe src="${ISHIGAKI_MAP_URL}" loading="lazy"></iframe>` : `<div class="map-placeholder">${t("noMap")}</div>`}</div>
          <a href="${mainIslands.ishigaki.official}" target="_blank" style="display:inline-block; background:#2c6e9e; color:white; padding:6px 12px; border-radius:40px; text-decoration:none; margin-top:8px;">${t("official")}</a>
          <button class="detail-btn" style="margin-top:12px; width:100%;">${t("details")}</button>
        </div>
        <div class="card" data-id="miyako">
          <h3>${getName(mainIslands.miyako.name)}</h3>
          <img class="card-img" src="${mainIslands.miyako.image}" onerror="this.src='https://placehold.co/600x300'">
          <p>${getName(mainIslands.miyako.desc)}</p>
          <div class="map">${MIYAKO_MAP_URL ? `<iframe src="${MIYAKO_MAP_URL}" loading="lazy"></iframe>` : `<div class="map-placeholder">${t("noMap")}</div>`}</div>
          <a href="${mainIslands.miyako.official}" target="_blank" style="display:inline-block; background:#2c6e9e; color:white; padding:6px 12px; border-radius:40px; text-decoration:none; margin-top:8px;">${t("official")}</a>
          <button class="detail-btn" style="margin-top:12px; width:100%;">${t("details")}</button>
        </div>
      </div>
      <hr>
      <div style="display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin:20px 0;">
        <button id="gotoYaeyama">${t("nearbyYaeyama")}</button>
        <button id="gotoMiyako">${t("nearbyMiyako")}</button>
      </div>
    `;
    document.querySelectorAll(".card").forEach(card => {
      const id = card.dataset.id;
      card.addEventListener("click", (e) => {
        if (e.target.tagName === 'A' || e.target.classList.contains('detail-btn')) return;
        currentDetailId = id;
        currentView = "detail";
        render();
      });
      card.querySelector(".detail-btn")?.addEventListener("click", (e) => {
        e.stopPropagation();
        currentDetailId = id;
        currentView = "detail";
        render();
      });
    });
    document.getElementById("gotoYaeyama")?.addEventListener("click", () => { currentGroup = "yaeyama"; currentView = "group"; render(); });
    document.getElementById("gotoMiyako")?.addEventListener("click", () => { currentGroup = "miyako"; currentView = "group"; render(); });
  }

  // 周辺島グループ
  function renderGroup() {
    const group = nearbyGroups[currentGroup];
    if (!group) { currentView = "main"; render(); return; }
    const app = document.getElementById("app");
    app.innerHTML = `
      <button class="back-btn" id="backToMain">← ${t("back")}</button>
      <h2 style="text-align:center">${getName(group.name)}</h2>
      <div class="island-list">
        ${group.list.map(sub => `<div class="list-item" data-id="${sub.id}">${getName({ en: sub.nameEn, ja: sub.nameJa, it: sub.nameIt, ru: sub.nameRu }, sub.id)}</div>`).join('')}
      </div>
    `;
    document.getElementById("backToMain")?.addEventListener("click", () => { currentView = "main"; render(); });
    document.querySelectorAll(".list-item").forEach(el => {
      el.addEventListener("click", () => {
        const subId = el.dataset.id;
        const found = [...nearbyGroups.yaeyama.list, ...nearbyGroups.miyako.list].find(i => i.id === subId);
        if (found) {
          window.tempDetail = found;
          currentDetailId = subId;
          currentView = "detail";
          render();
        }
      });
    });
  }

  // 詳細ページ（メイン島・周辺島共通、修正版）
  function renderDetail() {
    let data;
    let isMain = false;
    if (currentDetailId === "ishigaki") { data = mainIslands.ishigaki; isMain = true; }
    else if (currentDetailId === "miyako") { data = mainIslands.miyako; isMain = true; }
    else { data = window.tempDetail; isMain = false; }
    if (!data) { currentView = "main"; render(); return; }

    let name = "";
    let desc = "";
    let access = "";
    let sights = "";
    let tips = "";
    let official = "";
    let image = "";

    if (isMain) {
      name = getName(data.name);
      desc = getName(data.desc);
      access = getName(data.access);
      sights = getName(data.sights);
      tips = getName(data.tips);
      official = data.official;
      image = data.image;
    } else {
      // 周辺島：フラットなプロパティから言語対応テキストを取得
      name = getName({ en: data.nameEn, ja: data.nameJa, it: data.nameIt, ru: data.nameRu }, data.id);
      desc = getNearbyText(data, "desc");
      access = getNearbyText(data, "access");
      sights = getNearbyText(data, "sights");
      tips = getNearbyText(data, "tips");
      official = data.official || "#";
      image = data.image;
    }

    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="detail-view">
        <button class="back-btn" id="detailBack">← ${t("back")}</button>
        <h2>${name}</h2>
        <img class="detail-img" src="${image}" onerror="this.src='https://placehold.co/600x300'">
        <p><strong>📖 Description:</strong> ${desc}</p>
        ${access ? `<p><strong>🚢 Access:</strong> ${access}</p>` : ''}
        ${sights ? `<p><strong>🏖️ Sights:</strong> ${sights}</p>` : ''}
        ${tips ? `<p><strong>💡 Tips:</strong> ${tips}</p>` : ''}
        <p><strong>🔗 Official:</strong> <a href="${official}" target="_blank">${official}</a></p>
        <button class="back-btn" id="detailBack2">← ${t("back")}</button>
      </div>
    `;
    const goBack = () => { currentView = "main"; render(); };
    document.getElementById("detailBack")?.addEventListener("click", goBack);
    document.getElementById("detailBack2")?.addEventListener("click", goBack);
  }

  function render() {
    updateSponsors();
    document.getElementById("mainTitle").innerText = t("title");
    if (currentView === "main") renderMain();
    else if (currentView === "group") renderGroup();
    else if (currentView === "detail") renderDetail();
  }

  // 言語切り替え
  function setLang(l) { lang = l; render(); }
  document.getElementById("langEn")?.addEventListener("click", () => setLang("en"));
  document.getElementById("langIt")?.addEventListener("click", () => setLang("it"));
  document.getElementById("langRu")?.addEventListener("click", () => setLang("ru"));
  document.getElementById("langJa")?.addEventListener("click", () => setLang("ja"));

  // テーマ切り替え
  const body = document.body;
  if (localStorage.getItem("theme") === "light") { body.classList.remove("dark"); body.classList.add("light"); }
  else body.classList.add("dark");
  document.getElementById("themeBtn")?.addEventListener("click", () => {
    if (body.classList.contains("dark")) {
      body.classList.remove("dark"); body.classList.add("light");
      localStorage.setItem("theme", "light");
    } else {
      body.classList.remove("light"); body.classList.add("dark");
      localStorage.setItem("theme", "dark");
    }
  });

  // PWA インストール
  let deferredPrompt;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const btn = document.createElement("button");
    btn.textContent = "📲 Install App";
    btn.style.cssText = "background:#2c6e9e; color:white; border:none; padding:6px 12px; border-radius:40px; margin-left:10px; cursor:pointer;";
    btn.onclick = async () => {
      btn.remove();
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      }
    };
    document.querySelector(".toolbar")?.appendChild(btn);
  });

  // Service Worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then(reg => console.log("SW registered", reg)).catch(err => console.log("SW failed", err));
    });
  }

  render();
</script>
</body>
</html>
