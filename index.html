<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Yaeyama & Miyako Islands Guide</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e2a3a">
  <!-- Google Maps API (キーを設定してください) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY" async defer></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.2s;
    }

    body.dark {
      --bg: #121212;
      --surface: #1e2a3a;
      --text: #eef2f5;
      --text-secondary: #b0c4de;
      --border: #2d3e4e;
      --card-bg: #1e2a3a;
      --btn-bg: #2d3e4e;
    }
    body.light {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --text: #1e2a3a;
      --text-secondary: #2c3e50;
      --border: #ccd7e4;
      --card-bg: #ffffff;
      --btn-bg: #e9edf2;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      padding: 0 16px;
    }

    header, footer {
      background-color: var(--surface);
      padding: 16px;
      border-radius: 20px;
      margin: 16px 0;
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 12px;
    }

    .lang-btn, .theme-btn, .install-btn {
      background-color: var(--btn-bg);
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 40px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .sponsor-area {
      background-color: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 20px;
      padding: 16px;
      margin: 20px 0;
      text-align: center;
    }
    .sponsor-edit {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      justify-content: center;
    }
    .sponsor-edit input {
      padding: 8px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      flex: 1;
      min-width: 180px;
    }
    button {
      background-color: var(--btn-bg);
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      color: var(--text);
      cursor: pointer;
    }
    .sponsor-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .sponsor-img {
      max-width: 100%;
      max-height: 80px;
      border-radius: 12px;
    }
    .sponsor-link {
      color: #4a9eff;
      text-decoration: none;
    }

    .card-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin: 20px 0;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 20px;
      width: 300px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .main-island-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 20px;
      margin: 12px 0;
    }
    .official-btn {
      display: inline-block;
      margin-top: 12px;
      background-color: #2c6e9e;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.9rem;
    }
    .island-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
    }
    .list-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 14px 20px;
      cursor: pointer;
      font-weight: bold;
    }
    .detail-view {
      background: var(--card-bg);
      border-radius: 32px;
      padding: 24px;
      max-width: 800px;
      margin: 0 auto;
    }
    .detail-img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 24px;
      margin: 16px 0;
    }
    .back-btn {
      margin-top: 30px;
      display: inline-block;
    }
    footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }
    .map-container {
      margin: 24px 0;
      border-radius: 28px;
      overflow: hidden;
      height: 320px;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    hr {
      border-color: var(--border);
      margin: 12px 0;
    }
    @media (max-width: 640px) {
      body { padding: 0 12px; }
      .card { width: 100%; }
    }
  </style>
</head>

    };

    const detailsContent = {

    function t(key) { return translations[currentLang][key] || key; }
    function getName(obj, fallback) { return obj[currentLang] || obj.en || fallback; }

    let currentView = "main";
    let currentGroup = null;
    let currentDetailId = null;
    let deferredPrompt;
    let map;
    let markers = [];

    // マップ初期化（八重山諸島中心、主要島にマーカー）
    function initMap() {
      const mapContainer = document.getElementById("map");
      if (!mapContainer) return; // まだDOMにない場合は後で再試行
      const center = { lat: 24.3, lng: 124.0 };  // 八重山諸島を中心に設定
      map = new google.maps.Map(mapContainer, {
        center: center,
        zoom: 9.5,
        mapId: "YAEYAMA_MIYAKO"
      });

      // 既存のマーカーを削除
      markers.forEach(m => m.setMap(null));
      markers = [];

      // 主要な島々にマーカーを追加（名称付き）
      const islands = [
        { name: "Ishigaki", lat: 24.3442, lng: 124.1585 },
        { name: "Iriomote", lat: 24.3385, lng: 123.8230 },
        { name: "Taketomi", lat: 24.3243, lng: 124.0863 },
        { name: "Kohama", lat: 24.3415, lng: 123.9833 },
        { name: "Kuroshima", lat: 24.2333, lng: 124.0167 },
        { name: "Hateruma", lat: 24.0583, lng: 123.7833 },
        { name: "Miyako", lat: 24.8067, lng: 125.2811 },
        { name: "Irabu", lat: 24.8344, lng: 125.1967 }
      ];
      islands.forEach(island => {
        const marker = new google.maps.Marker({
          position: { lat: island.lat, lng: island.lng },
          map: map,
          title: island.name,
          animation: google.maps.Animation.DROP
        });
        markers.push(marker);
      });
    }

    // 地図のリサイズ＆再センタリング（メインページ表示時に呼ぶ）
    function resetMap() {
      if (map && currentView === "main") {
        google.maps.event.trigger(map, "resize");
        map.setCenter({ lat: 24.3, lng: 124.0 });
        map.setZoom(9.5);
      } else if (currentView === "main" && typeof google !== "undefined" && google.maps) {
        // マップがまだ未初期化なら初期化を試みる
        initMap();
      } else if (currentView === "main" && typeof google === "undefined") {
        // Google Maps API がまだ読み込まれていない場合、待つ
        setTimeout(resetMap, 200);
      }
    }

    // レンダリング
    function render() {
      const app = document.getElementById("app");
      if (currentView === "main") {
        app.innerHTML = `

              <a href="${mainIslandsDetails.ishigaki.official}" target="_blank" class="official-btn" onclick="event.stopPropagation()">${t("officialWebsite")}</a>
              <div style="margin-top:12px"><button class="detail-btn">${t("detailsButton")}</button></div>
            </div>
            <div class="card" data-detail="miyakoMain">
              <h3>${getName(mainIslandsDetails.miyakoMain.name, "Miyako")}</h3>
              <img class="main-island-img" src="${mainIslandsDetails.miyakoMain.image}" alt="Miyako" onerror="this.src='https://placehold.co/600x300?text=Miyako'">
              <p>${getName(mainIslandsDetails.miyakoMain.description, "Coral paradise.")}</p>
              <a href="${mainIslandsDetails.miyakoMain.official}" target="_blank" class="official-btn" onclick="event.stopPropagation()">${t("officialWebsite")}</a>
              <div style="margin-top:12px"><button class="detail-btn">${t("detailsButton")}</button></div>
            </div>
          </div>
          <hr>
          <div style="text-align:center; margin: 20px 0 10px;">
            <h3>🔍 Explore Nearby Islands</h3>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:16px; margin-top:12px;">
              <button id="gotoYaeyamaGroup" style="background:#2c6e9e;">🏝️ Ishigaki's Nearby Islands (Yaeyama)</button>
              <button id="gotoMiyakoGroup" style="background:#2c6e9e;">🏝️ Miyako's Nearby Islands</button>
            </div>
          </div>
          <div class="map-container"><div id="map"></div></div>
        `;
        // カードのイベント
        document.querySelectorAll(".card").forEach(card => {
          const detailId = card.dataset.detail;
          const detailBtn = card.querySelector(".detail-btn");
          const gotoDetail = () => {
            currentDetailId = detailId;
            currentView = "detail";
            render();
          };
          card.addEventListener("click", gotoDetail);
          if (detailBtn) detailBtn.addEventListener("click", (e) => { e.stopPropagation(); gotoDetail(); });
        });
        document.getElementById("gotoYaeyamaGroup")?.addEventListener("click", () => {
          currentGroup = "yaeyama";
          currentView = "group";
          render();
        });
        document.getElementById("gotoMiyakoGroup")?.addEventListener("click", () => {
          currentGroup = "miyako";
          currentView = "group";
          render();
        });
        // 地図の初期化またはリセット
        if (typeof google !== "undefined" && google.maps) {
          if (!map) initMap();
          else resetMap();
        } else {
          // APIがまだ読み込まれていない場合は少し待って再試行
          setTimeout(() => { if (currentView === "main") resetMap(); }, 500);
        }
      } 
      else if (currentView === "group") {
        const group = islandsData[currentGroup];
        const subList = group.subIslands;
        app.innerHTML = `
          <button class="back-btn" id="backMainFromGroup">← ${t("backToMain")}</button>
          <h2 style="text-align:center">${getName(group.name, currentGroup)}</h2>
          <div class="island-list">
            ${subList.map(sub => `<div class="list-item" data-id="${sub.id}">${getName({ en: sub.nameEn, ja: sub.nameJa, it: sub.nameIt, ru: sub.nameRu }, sub.id)}</div>`).join('')}
          </div>
        `;
        document.getElementById("backMainFromGroup")?.addEventListener("click", () => {
          currentView = "main";
          render();
        });
        document.querySelectorAll(".list-item").forEach(el => {
          el.addEventListener("click", () => {
            currentDetailId = el.dataset.id;
            currentView = "detail";
            render();
          });
        });
      }
      else if (currentView === "detail") {
        const d = detailsContent[currentDetailId];
        if (!d) { currentView = "main"; render(); return; }
        const desc = d.description?.[currentLang] || d.description?.en || "";
        const access = d.access?.[currentLang] || d.access?.en || "";
        const sights = d.sights?.[currentLang] || d.sights?.en || "";
        const tips = d.tips?.[currentLang] || d.tips?.en || "";
        const officialUrl = d.official || "#";
        app.innerHTML = `
          <div class="detail-view">
            <button class="back-btn" id="backMainFromDetail">← ${t("backToMain")}</button>
            <h2>${getName(d.name || { en: currentDetailId }, currentDetailId)}</h2>
            <img class="detail-img" src="${d.image}" alt="${currentDetailId}" onerror="this.src='https://placehold.co/600x300?text=Image+not+found'">
            <p><strong>📖 Description:</strong> ${desc}</p>
            <p><strong>🚢 Access:</strong> ${access}</p>
            <p><strong>🏖️ Sights / Beach:</strong> ${sights}</p>
            <p><strong>💡 Travel Tips:</strong> ${tips}</p>
            <p><strong>🔗 Official site:</strong> <a href="${officialUrl}" target="_blank">${officialUrl}</a></p>
            <button class="back-btn" id="backMainFromDetailBottom">← ${t("backToMain")}</button>
          </div>
        `;
        const goMain = () => { currentView = "main"; render(); };
        document.getElementById("backMainFromDetail")?.addEventListener("click", goMain);
        document.getElementById("backMainFromDetailBottom")?.addEventListener("click", goMain);
      }
      updateSponsorDisplay();
      document.getElementById("main-title").innerText = t("title");
    }

    // スポンサー関連 (前回と同じ)
    function updateSponsorDisplay() {
      const imgUrl = localStorage.getItem("sponsorImg") || "";
      const siteUrl = localStorage.getItem("sponsorUrl") || "";
      const htmlTop = imgUrl ? `<img class="sponsor-img" src="${imgUrl}" alt="sponsor"><br><a class="sponsor-link" href="${siteUrl}" target="_blank">${siteUrl}</a>` : `<span>${t("sponsorDefault")}<br><small>Set image & URL above</small></span>`;
      const htmlBottom = imgUrl ? `<img class="sponsor-img" src="${imgUrl}" alt="sponsor"><br><a class="sponsor-link" href="${siteUrl}" target="_blank">Visit Sponsor</a>` : `<span>${t("sponsorDefault")}</span>`;
      document.getElementById("sponsorContentTop").innerHTML = htmlTop;
      document.getElementById("sponsorContentBottom").innerHTML = htmlBottom;
    }
    document.getElementById("saveSponsor")?.addEventListener("click", () => {
      localStorage.setItem("sponsorImg", document.getElementById("sponsorImgUrl").value);
      localStorage.setItem("sponsorUrl", document.getElementById("sponsorSiteUrl").value);
      updateSponsorDisplay();
    });
    function loadSponsorFromStorage() {
      document.getElementById("sponsorImgUrl").value = localStorage.getItem("sponsorImg") || "";
      document.getElementById("sponsorSiteUrl").value = localStorage.getItem("sponsorUrl") || "";
      updateSponsorDisplay();
    }

    // 言語
    function setLang(lang) { currentLang = lang; render(); loadSponsorFromStorage(); }
    document.getElementById("langEN")?.addEventListener("click", () => setLang("en"));
    document.getElementById("langIT")?.addEventListener("click", () => setLang("it"));
    document.getElementById("langRU")?.addEventListener("click", () => setLang("ru"));
    document.getElementById("langJA")?.addEventListener("click", () => setLang("ja"));

    // テーマ
    const body = document.body;
    const themeToggle = document.getElementById("themeToggle");
    if (localStorage.getItem("theme") === "light") { body.classList.remove("dark"); body.classList.add("light"); }
    else body.classList.add("dark");
    themeToggle?.addEventListener("click", () => {
      if (body.classList.contains("dark")) {
        body.classList.remove("dark"); body.classList.add("light");
        localStorage.setItem("theme", "light");
      } else {
        body.classList.remove("light"); body.classList.add("dark");
        localStorage.setItem("theme", "dark");
      }
    });

    // PWA インストール
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById("installApp");
      if (installBtn) installBtn.style.display = "inline-flex";
      installBtn?.addEventListener("click", async () => {
        installBtn.style.display = "none";
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
      });
    });

    // Service Worker 登録
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then(reg => console.log("SW registered:", reg)).catch(err => console.log("SW failed:", err));
      });
    }

    loadSponsorFromStorage();
    render();
    // Google Maps がロードされたときのフォールバック
    window.initMap = initMap;
  </script>
</body>
</html>
