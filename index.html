<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Yaeyama & Miyako Islands Guide</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e2a3a">
  <!-- Google Maps API (キーを設定してください) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.2s;
    }

    /* ダークモード (デフォルト) */
    body.dark {
      --bg: #121212;
      --surface: #1e2a3a;
      --text: #eef2f5;
      --text-secondary: #b0c4de;
      --border: #2d3e4e;
      --card-bg: #1e2a3a;
      --btn-bg: #2d3e4e;
    }
    /* ライトモード */
    body.light {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --text: #1e2a3a;
      --text-secondary: #2c3e50;
      --border: #ccd7e4;
      --card-bg: #ffffff;
      --btn-bg: #e9edf2;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      padding: 0 16px;
    }

    /* ヘッダー・フッターは固定せず通常のブロック */
    header, footer {
      background-color: var(--surface);
      padding: 16px;
      border-radius: 20px;
      margin: 16px 0;
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 12px;
    }

    .lang-btn, .theme-btn {
      background-color: var(--btn-bg);
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 40px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* スポンサー枠 */
    .sponsor-area {
      background-color: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 20px;
      padding: 16px;
      margin: 20px 0;
      text-align: center;
    }
    .sponsor-edit {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      justify-content: center;
    }
    .sponsor-edit input {
      padding: 8px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      flex: 1;
      min-width: 180px;
    }
    button {
      background-color: var(--btn-bg);
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      color: var(--text);
      cursor: pointer;
    }
    .sponsor-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .sponsor-img {
      max-width: 100%;
      max-height: 80px;
      border-radius: 12px;
    }
    .sponsor-link {
      color: #4a9eff;
      text-decoration: none;
    }

    /* メインコンテンツ */
    .card-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin: 20px 0;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 20px;
      width: 260px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .island-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
    }
    .list-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 14px 20px;
      cursor: pointer;
      font-weight: bold;
    }
    .detail-view {
      background: var(--card-bg);
      border-radius: 32px;
      padding: 24px;
      max-width: 800px;
      margin: 0 auto;
    }
    .detail-img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 24px;
      margin: 16px 0;
    }
    .back-btn {
      margin-top: 30px;
      display: inline-block;
    }
    footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }
    .map-container {
      margin: 24px 0;
      border-radius: 28px;
      overflow: hidden;
      height: 320px;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    hr {
      border-color: var(--border);
      margin: 12px 0;
    }
    @media (max-width: 640px) {
      body { padding: 0 12px; }
    }
  </style>
</head>
<body class="dark">
  <header>
    <h1 id="main-title">🌊 Yaeyama & Miyako Islands</h1>
    <div class="toolbar">
      <button class="theme-btn" id="themeToggle">🌓 Dark/Light</button>
      <button class="lang-btn" id="langEN">🇬🇧 EN</button>
      <button class="lang-btn" id="langIT">🇮🇹 IT</button>
      <button class="lang-btn" id="langRU">🇷🇺 RU</button>
      <button class="lang-btn" id="langJA">🇯🇵 JA</button>
    </div>
  </header>

  <!-- スポンサー上部 -->
  <div class="sponsor-area" id="sponsorTop">
    <div class="sponsor-content" id="sponsorContentTop">
      <span id="sponsorTextTop">✨ Sponsor space ✨</span>
    </div>
    <div class="sponsor-edit">
      <input type="text" id="sponsorImgUrl" placeholder="画像URL (jpg/png)" value="">
      <input type="text" id="sponsorSiteUrl" placeholder="公式HP URL" value="">
      <button id="saveSponsor">保存して反映</button>
    </div>
  </div>

  <!-- メイン動的エリア -->
  <main id="app">
    <!-- ここにJSで描画 -->
  </main>

  <!-- スポンサー下部 -->
  <div class="sponsor-area" id="sponsorBottom">
    <div class="sponsor-content" id="sponsorContentBottom">
      <span>✨ Sponsor space ✨</span>
    </div>
  </div>

  <footer>
    <p>Contact us<br><a href="mailto:mementomorikatsu@gmail.com">mementomorikatsu@gmail.com</a></p>
  </footer>

  <script>
    // ---------- 多言語データ ----------
    const translations = {
      en: {
        title: "🌊 Yaeyama & Miyako Islands",
        mainPageTitle: "Select Main Island",
        backToMain: "← Back to Main",
        sponsorDefault: "✨ Sponsor space ✨"
      },
      it: {
        title: "🌊 Isole Yaeyama e Miyako",
        mainPageTitle: "Seleziona l'isola principale",
        backToMain: "← Torna alla Home",
        sponsorDefault: "✨ Spazio Sponsor ✨"
      },
      ru: {
        title: "🌊 Острова Яэяма и Мияко",
        mainPageTitle: "Выберите главный остров",
        backToMain: "← На главную",
        sponsorDefault: "✨ Место для спонсора ✨"
      },
      ja: {
        title: "🌊 八重山・宮古諸島ガイド",
        mainPageTitle: "メイン島を選ぶ",
        backToMain: "← メインページへ戻る",
        sponsorDefault: "✨ スポンサー枠 ✨"
      }
    };
    let currentLang = "en";

    // ---------- 島データ (グループ + 詳細) ----------
    const islandsData = {
      yaeyama: {
        name: { en: "Ishigaki Island", it: "Ishigaki", ru: "Исигаки", ja: "石垣島" },
        subIslands: [
          { id: "iriomote", nameEn: "Iriomote", nameJa: "西表島", nameIt: "Iriomote", nameRu: "Ириомоте" },
          { id: "taketomi", nameEn: "Taketomi", nameJa: "竹富島", nameIt: "Taketomi", nameRu: "Такетоми" },
          { id: "kohama", nameEn: "Kohama", nameJa: "小浜島", nameIt: "Kohama", nameRu: "Кохама" },
          { id: "kuro", nameEn: "Kuro", nameJa: "黒島", nameIt: "Kuro", nameRu: "Куро" },
          { id: "hatoma", nameEn: "Hatoma", nameJa: "鳩間島", nameIt: "Hatoma", nameRu: "Хатома" }
        ]
      },
      miyako: {
        name: { en: "Miyako Island", it: "Miyako", ru: "Мияко", ja: "宮古島" },
        subIslands: [
          { id: "irrabu", nameEn: "Irabu", nameJa: "伊良部島", nameIt: "Irabu", nameRu: "Ирабу" },
          { id: "shimoji", nameEn: "Shimoji", nameJa: "下地島", nameIt: "Shimoji", nameRu: "Симодзи" },
          { id: "ikema", nameEn: "Ikema", nameJa: "池間島", nameIt: "Ikema", nameRu: "Икэма" },
          { id: "kurima", nameEn: "Kurima", nameJa: "来間島", nameIt: "Kurima", nameRu: "Курима" }
        ]
      }
    };

    // 詳細コンテンツ (各島の詳細)
    const detailsContent = {
      iriomote: {
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Iriomote_Island_View.jpg/640px-Iriomote_Island_View.jpg",
        description: { en: "Lush jungle, Iriomote wild cat, kayaking.", ja: "マングローブのカヤック、西表山猫で有名。", it: "Giungla lussureggiante, gatto selvatico di Iriomote.", ru: "Пышные джунгли, дикая кошка Ириомоте." },
        access: { en: "30 min high-speed boat from Ishigaki port.", ja: "石垣港から高速船で30分。", it: "30 min di traghetto da Ishigaki.", ru: "30 минут на катере от Исигаки." },
        sights: { en: "Pinaisara Falls, Hoshizuna Beach", ja: "ピナイサーラの滝、星砂の浜", it: "Cascate Pinaisara, Spiaggia di Hoshizuna", ru: "Водопад Пинайсара, Пляж Хосидзуна" },
        tips: { en: "Bring insect repellent. Best season: spring/autumn.", ja: "虫除け必須。春・秋がおすすめ。", it: "Porta repellente. Primavera/autunno migliori.", ru: "Берите репеллент. Лучше весной/осенью." },
        official: "https://visitokinawa.jp/"
      },
      taketomi: {
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Taketomi_Island_buffalo_cart.jpg/640px-Taketomi_Island_buffalo_cart.jpg",
        description: { en: "Traditional Ryukyu village, water buffalo carts.", ja: "水牛車と赤瓦の集落。", it: "Villaggio tradizionale Ryukyu, carri trainati da bufali.", ru: "Традиционная деревня Рюкю, повозки с буйволами." },
        access: { en: "10-15 min ferry from Ishigaki.", ja: "石垣港からフェリーで10〜15分。", it: "Traghetto 10-15 min da Ishigaki.", ru: "10-15 мин на пароме от Исигаки." },
        sights: { en: "Kondoi Beach, Star Sand", ja: "コンドイビーチ、星砂", it: "Spiaggia Kondoi, Sabbia a stella", ru: "Пляж Кондой, Звездный песок" },
        tips: { en: "Rent a bike to explore.", ja: "レンタル自転車が便利。", it: "Noleggia una bici.", ru: "Арендуйте велосипед." },
        official: "https://www.taketomi-island.jp/"
      },
      kohama: {
        image: "https://upload.wikimedia.org/wikipedia/commons/1/1f/Kohama_Island_01.jpg",
        description: { en: "Relaxed island, sugarcane fields.", ja: "のどかな島、サトウキビ畑。", it: "Isola tranquilla, campi di canna da zucchero.", ru: "Спокойный остров, поля сахарного тростника." },
        access: { en: "25 min ferry from Ishigaki.", ja: "石垣港から25分。", it: "25 min di traghetto.", ru: "25 минут паромом." },
        sights: { en: "Sugar Road, Ufudachii", ja: "シュガーロード、ウフダチィ", it: "Sugar Road, Ufudachii", ru: "Сахарная дорога, Уфудачи" },
        tips: { en: "Great for cycling.", ja: "サイクリングに最適。", it: "Ottimo per ciclismo.", ru: "Отлично для велосипеда." },
        official: "#"
      },
      kuro: { image: "https://upload.wikimedia.org/wikipedia/commons/0/0f/Kuroshima_Island_-_pasture.jpg", description: { en: "Famous for cows and starry sky.", ja: "牛と星空の島。", it: "Famoso per mucche e cielo stellato.", ru: "Знаменит коровами и звездами." }, access: { en: "25 min ferry.", ja: "石垣港から25分。" }, sights: { en: "Aiyaruhama Beach.", ja: "アイヤル浜" }, tips: { en: "Rent an ebike.", ja: "電動自転車推奨。" }, official: "#" },
      hatoma: { image: "https://upload.wikimedia.org/wikipedia/commons/9/95/Hatoma_Island.jpg", description: { en: "Tiny remote island, beautiful sunset.", ja: "小さな離島、絶景の夕日。", it: "Piccola remota, tramonto stupendo.", ru: "Маленький отдаленный остров." }, access: { en: "40 min ferry.", ja: "石垣港から40分。" }, sights: { en: "Hatoma Beach.", ja: "鳩間ビーチ" }, tips: { en: "No convenience store.", ja: "コンビニなし。" }, official: "#" },
      irrabu: { image: "https://upload.wikimedia.org/wikipedia/commons/f/fb/Irabu_Ohashi_Bridge.jpg", description: { en: "Connected by Irabu Bridge, stunning ocean views.", ja: "伊良部大橋で接続、絶景。", it: "Collegato da Irabu Bridge.", ru: "Соединён мостом Ирабу." }, access: { en: "Drive from Miyako.", ja: "宮古島から車で渡る。" }, sights: { en: "Toguchi no Hama beach, Makiyama Observatory.", ja: "渡口の浜、牧山展望台" }, tips: { en: "Sunset drive amazing.", ja: "ドライブ最高。" }, official: "#" },
      shimoji: { image: "https://upload.wikimedia.org/wikipedia/commons/0/0c/Shimoji_Island_airport.jpg", description: { en: "Clear waters, aircraft spotting.", ja: "透明度抜群、飛行機展望。", it: "Acque cristalline, aerei.", ru: "Прозрачная вода, самолёты." }, access: { en: "Bridge from Irabu.", ja: "伊良部島経由。" }, sights: { en: "Toriike Pond, Subarine Bridge.", ja: "通り池、サバリン橋" }, tips: { en: "Snorkeling gear needed.", ja: "シュノーケル用意。" }, official: "#" },
      ikema: { image: "https://upload.wikimedia.org/wikipedia/commons/8/87/Ikema_Island_Ohashi.jpg", description: { en: "Pastoral landscape, excellent stargazing.", ja: "牧歌的風景、星空観測。", it: "Paesaggio pastorale, stelle.", ru: "Пасторальный пейзаж." }, access: { en: "Ikema-Ohashi bridge.", ja: "池間大橋で渡る。" }, sights: { en: "Ikema Beach, Mt. Akatsuka.", ja: "池間ビーチ、赤塚山" }, tips: { en: "Great for e-bike.", ja: "電動自転車で探検。" }, official: "#" },
      kurima: { image: "https://upload.wikimedia.org/wikipedia/commons/6/6a/Kurima_Bridge.jpg", description: { en: "Small island with panoramic views.", ja: "パノラマ展望の小島。", it: "Piccola isola panoramica.", ru: "Маленький остров с видами." }, access: { en: "Kurima Bridge (from Miyako).", ja: "来間大橋。" }, sights: { en: "Kurima Beach, Nanseikan observatory.", ja: "来間ビーチ、南西観測所" }, tips: { en: "Walking possible.", ja: "徒歩でも楽しめる。" }, official: "#" }
    };

    // helper 多言語
    function t(key) {
      return translations[currentLang][key] || key;
    }
    function getName(obj, fallback) {
      return obj[currentLang] || obj.en || fallback;
    }

    let currentView = "main"; // main, group, detail
    let currentGroup = null;
    let currentDetailId = null;

    // マップ
    let map;
    function initMap() {
      const center = { lat: 24.6, lng: 124.7 }; // 石垣・宮古の海上
      map = new google.maps.Map(document.getElementById("map"), {
        center: center,
        zoom: 8.5,
        mapId: "ISLANDS_MAP"
      });
      new google.maps.Marker({ position: { lat: 24.3442, lng: 124.1585 }, map, title: "Ishigaki" });
      new google.maps.Marker({ position: { lat: 24.8067, lng: 125.2811 }, map, title: "Miyako" });
    }

    // レンダリング制御
    function render() {
      const app = document.getElementById("app");
      if (currentView === "main") {
        app.innerHTML = `
          <h2 style="text-align:center">${t("mainPageTitle")}</h2>
          <div class="card-grid">
            <div class="card" data-island="yaeyama">
              <h3>${getName(islandsData.yaeyama.name, "Yaeyama (Ishigaki)")}</h3>
              <p>🏝️ 八重山群島</p>
            </div>
            <div class="card" data-island="miyako">
              <h3>${getName(islandsData.miyako.name, "Miyako")}</h3>
              <p>🏝️ 宮古群島</p>
            </div>
          </div>
        `;
        document.querySelectorAll(".card").forEach(card => {
          card.addEventListener("click", (e) => {
            currentGroup = card.dataset.island;
            currentView = "group";
            render();
          });
        });
      } 
      else if (currentView === "group") {
        const group = islandsData[currentGroup];
        const subList = group.subIslands;
        app.innerHTML = `
          <button class="back-btn" id="backMainFromGroup">← ${t("backToMain")}</button>
          <h2 style="text-align:center">${getName(group.name, currentGroup)} & Nearby Islands</h2>
          <div class="island-list">
            ${subList.map(sub => `<div class="list-item" data-id="${sub.id}">${getName({ en: sub.nameEn, ja: sub.nameJa, it: sub.nameIt, ru: sub.nameRu }, sub.id)}</div>`).join('')}
          </div>
        `;
        document.getElementById("backMainFromGroup")?.addEventListener("click", () => {
          currentView = "main";
          render();
        });
        document.querySelectorAll(".list-item").forEach(el => {
          el.addEventListener("click", (e) => {
            currentDetailId = el.dataset.id;
            currentView = "detail";
            render();
          });
        });
      }
      else if (currentView === "detail") {
        const d = detailsContent[currentDetailId];
        if (!d) { currentView = "main"; render(); return; }
        const lang = currentLang;
        const desc = d.description?.[lang] || d.description?.en || "";
        const access = d.access?.[lang] || d.access?.en || "";
        const sights = d.sights?.[lang] || d.sights?.en || "";
        const tips = d.tips?.[lang] || d.tips?.en || "";
        app.innerHTML = `
          <div class="detail-view">
            <button class="back-btn" id="backMainFromDetail">← ${t("backToMain")}</button>
            <h2>${currentDetailId.toUpperCase()}</h2>
            <img class="detail-img" src="${d.image}" alt="${currentDetailId}" onerror="this.src='https://placehold.co/600x300?text=Image+not+found'">
            <p><strong>📖 Description:</strong> ${desc}</p>
            <p><strong>🚢 Access:</strong> ${access}</p>
            <p><strong>🏖️ Sights / Beach:</strong> ${sights}</p>
            <p><strong>💡 Travel Tips:</strong> ${tips}</p>
            <p><strong>🔗 Official site:</strong> <a href="${d.official}" target="_blank">${d.official}</a></p>
            <button class="back-btn" id="backMainFromDetailBottom">← ${t("backToMain")}</button>
          </div>
        `;
        const goMain = () => { currentView = "main"; render(); };
        document.getElementById("backMainFromDetail")?.addEventListener("click", goMain);
        document.getElementById("backMainFromDetailBottom")?.addEventListener("click", goMain);
      }
      updateSponsorDisplay();  // スポンサーは上下独立
      document.querySelectorAll("[data-lang]").forEach(btn => {});
      document.getElementById("main-title").innerText = t("title");
    }

    // スポンサー保存＆表示
    function updateSponsorDisplay() {
      const imgUrl = localStorage.getItem("sponsorImg") || "";
      const siteUrl = localStorage.getItem("sponsorUrl") || "";
      const htmlTop = imgUrl ? `<img class="sponsor-img" src="${imgUrl}" alt="sponsor"><br><a class="sponsor-link" href="${siteUrl}" target="_blank">${siteUrl}</a>` : `<span>${t("sponsorDefault")}<br><small>Set image & URL above</small></span>`;
      const htmlBottom = imgUrl ? `<img class="sponsor-img" src="${imgUrl}" alt="sponsor"><br><a class="sponsor-link" href="${siteUrl}" target="_blank">Visit Sponsor</a>` : `<span>${t("sponsorDefault")}</span>`;
      document.getElementById("sponsorContentTop").innerHTML = htmlTop;
      document.getElementById("sponsorContentBottom").innerHTML = htmlBottom;
    }

    document.getElementById("saveSponsor")?.addEventListener("click", () => {
      const img = document.getElementById("sponsorImgUrl").value;
      const url = document.getElementById("sponsorSiteUrl").value;
      localStorage.setItem("sponsorImg", img);
      localStorage.setItem("sponsorUrl", url);
      updateSponsorDisplay();
    });
    function loadSponsorFromStorage() {
      const savedImg = localStorage.getItem("sponsorImg") || "";
      const savedUrl = localStorage.getItem("sponsorUrl") || "";
      document.getElementById("sponsorImgUrl").value = savedImg;
      document.getElementById("sponsorSiteUrl").value = savedUrl;
      updateSponsorDisplay();
    }

    // 言語切り替え
    function setLang(lang) {
      currentLang = lang;
      render();
      loadSponsorFromStorage(); // keep sponsor texts update
    }
    document.getElementById("langEN")?.addEventListener("click", () => setLang("en"));
    document.getElementById("langIT")?.addEventListener("click", () => setLang("it"));
    document.getElementById("langRU")?.addEventListener("click", () => setLang("ru"));
    document.getElementById("langJA")?.addEventListener("click", () => setLang("ja"));

    // テーマ (ダークメイン)
    const body = document.body;
    const themeToggle = document.getElementById("themeToggle");
    if (localStorage.getItem("theme") === "light") body.classList.remove("dark"), body.classList.add("light");
    else body.classList.add("dark");
    themeToggle?.addEventListener("click", () => {
      if (body.classList.contains("dark")) {
        body.classList.remove("dark");
        body.classList.add("light");
        localStorage.setItem("theme", "light");
      } else {
        body.classList.remove("light");
        body.classList.add("dark");
        localStorage.setItem("theme", "dark");
      }
    });

    // 初期表示
    loadSponsorFromStorage();
    render();
    window.initMap = initMap;
  </script>
</body>
</html>
