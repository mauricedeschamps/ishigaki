<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Yaeyama & Miyako Islands Guide</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e2a3a">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s, color 0.2s; }
    body.dark { --bg: #121212; --surface: #1e2a3a; --text: #eef2f5; --text-secondary: #b0c4de; --border: #2d3e4e; --card-bg: #1e2a3a; --btn-bg: #2c6e9e; --btn-hover: #1e4f73; }
    body.light { --bg: #f5f7fa; --surface: #ffffff; --text: #1e2a3a; --text-secondary: #2c3e50; --border: #ccd7e4; --card-bg: #ffffff; --btn-bg: #2c6e9e; --btn-hover: #1e4f73; }
    body { background-color: var(--bg); color: var(--text); font-family: system-ui, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; padding: 0 16px; }
    header, footer { background-color: var(--surface); padding: 16px; border-radius: 20px; margin: 16px 0; border: 1px solid var(--border); }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    .toolbar { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; margin-top: 12px; }
    .lang-btn, .theme-btn, .install-btn { background-color: var(--btn-bg); border: none; font-size: 1rem; cursor: pointer; padding: 8px 16px; border-radius: 40px; color: white; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
    .lang-btn:hover, .theme-btn:hover, .install-btn:hover { background-color: var(--btn-hover); }
    .sponsor-area { background-color: var(--surface); border: 1px dashed var(--border); border-radius: 20px; padding: 16px; margin: 20px 0; text-align: center; }
    .sponsor-content { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .sponsor-img { max-width: 100%; max-height: 80px; border-radius: 12px; object-fit: contain; }
    .sponsor-link { color: #4a9eff; text-decoration: none; }
    .card-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin: 20px 0; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 28px; padding: 20px; width: 380px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
    .main-island-img { width: 100%; height: 160px; object-fit: cover; border-radius: 20px; margin: 12px 0; }
    .map-preview { margin: 16px 0 12px; border-radius: 16px; overflow: hidden; background: var(--bg); height: 200px; }
    .map-preview iframe { width: 100%; height: 100%; border: none; }
    .map-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; background: var(--btn-bg); color: white; font-size: 0.9rem; text-align: center; padding: 20px; border-radius: 16px; }
    .official-btn, .detail-btn, .back-btn, .group-btn { display: inline-block; background-color: var(--btn-bg); color: white; text-decoration: none; padding: 8px 20px; border-radius: 40px; font-size: 0.9rem; font-weight: 500; border: none; cursor: pointer; transition: background-color 0.2s; }
    .official-btn:hover, .detail-btn:hover, .back-btn:hover, .group-btn:hover { background-color: var(--btn-hover); }
    .detail-btn { width: 100%; margin-top: 8px; }
    .island-list { display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: 0 auto; }
    .list-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 40px; padding: 14px 20px; cursor: pointer; font-weight: bold; text-align: center; transition: background 0.2s; }
    .list-item:hover { background: var(--btn-bg); color: white; }
    .detail-view { background: var(--card-bg); border-radius: 32px; padding: 24px; max-width: 800px; margin: 0 auto; }
    .detail-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 24px; margin: 16px 0; }
    footer a { color: var(--text-secondary); text-decoration: none; }
    hr { border-color: var(--border); margin: 12px 0; }
    .button-group { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 20px 0; }
    @media (max-width: 640px) { body { padding: 0 12px; } .card { width: 100%; } }
  </style>
</head>
<body class="dark">
  <header>
    <h1 id="main-title">🌊 Yaeyama & Miyako Islands</h1>
    <div class="toolbar">
      <button class="theme-btn" id="themeToggle">🌓 Dark/Light</button>
      <button class="lang-btn" id="langEN">🇬🇧 EN</button>
      <button class="lang-btn" id="langIT">🇮🇹 IT</button>
      <button class="lang-btn" id="langRU">🇷🇺 RU</button>
      <button class="lang-btn" id="langJA">🇯🇵 JA</button>
      <button class="install-btn" id="installApp" style="display:none;">📲 Install App</button>
    </div>
  </header>

  <div class="sponsor-area" id="sponsorTop">
    <div class="sponsor-content" id="sponsorContentTop"><span>✨ Sponsor space ✨</span></div>
  </div>

  <main id="app"></main>

  <div class="sponsor-area" id="sponsorBottom">
    <div class="sponsor-content" id="sponsorContentBottom"><span>✨ Sponsor space ✨</span></div>
  </div>

  <footer><p>Contact us<br><a href="mailto:mementomorikatsu@gmail.com">mementomorikatsu@gmail.com</a></p></footer>

  <script>
    // ============================================================
    // ★ 設定エリア（ここを編集）
    // ============================================================
    const SPONSOR_IMG_URL = "";      // 広告画像URL（空で非表示）
    const SPONSOR_SITE_URL = "";     // 広告リンク先
    const ISHIGAKI_MAP_URL = "";     // 石垣島地図iframe src
    const MIYAKO_MAP_URL = "";       // 宮古島地図iframe src
    // ============================================================

    // 多言語
    const translations = {
      en: { title: "🌊 Yaeyama & Miyako Islands", mainPageTitle: "Main Islands", backToMain: "← Back to Main", sponsorDefault: "✨ Sponsor space ✨", officialWebsite: "Official Website", detailsButton: "View Details →", noMap: "🗺️ Map not set. Edit code.", nearIslandsBtn: "🏝️ Nearby Islands (Yaeyama)", nearMiyakoBtn: "🏝️ Nearby Islands (Miyako)" },
      it: { title: "🌊 Isole Yaeyama e Miyako", mainPageTitle: "Isole Principali", backToMain: "← Torna alla Home", sponsorDefault: "✨ Spazio Sponsor ✨", officialWebsite: "Sito Ufficiale", detailsButton: "Vedi Dettagli →", noMap: "🗺️ Mappa non impostata.", nearIslandsBtn: "🏝️ Isole vicine (Yaeyama)", nearMiyakoBtn: "🏝️ Isole vicine (Miyako)" },
      ru: { title: "🌊 Острова Яэяма и Мияко", mainPageTitle: "Главные острова", backToMain: "← На главную", sponsorDefault: "✨ Место для спонсора ✨", officialWebsite: "Официальный сайт", detailsButton: "Подробнее →", noMap: "🗺️ Карта не задана.", nearIslandsBtn: "🏝️ Ближайшие острова (Яэяма)", nearMiyakoBtn: "🏝️ Ближайшие острова (Мияко)" },
      ja: { title: "🌊 八重山・宮古諸島ガイド", mainPageTitle: "メイン島", backToMain: "← メインページへ戻る", sponsorDefault: "✨ スポンサー枠 ✨", officialWebsite: "公式サイト", detailsButton: "詳細を見る →", noMap: "🗺️ 地図未設定", nearIslandsBtn: "🏝️ 石垣島周辺の島々（八重山）", nearMiyakoBtn: "🏝️ 宮古島周辺の島々" }
    };
    let currentLang = "en";

    // 島データ（簡略化のため省略、元のコードと同じ構造）
    const mainIslandsDetails = {
      ishigaki: { id:"ishigaki", name:{en:"Ishigaki Island",ja:"石垣島",it:"Ishigaki",ru:"Исигаки"}, image:"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Ishigaki_island_NASA.jpg/640px-Ishigaki_island_NASA.jpg", description:{en:"Gateway to Yaeyama.",ja:"八重山の玄関口。"}, access:{en:"Flights from Tokyo."}, sights:{en:"Kabira Bay."}, tips:{en:"Rent a car."}, official:"https://visitokinawa.jp/", group:"yaeyama" },
      miyakoMain: { id:"miyakoMain", name:{en:"Miyako Island",ja:"宮古島",it:"Miyako",ru:"Мияко"}, image:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Miyakojima_Island_NASA.jpg/640px-Miyakojima_Island_NASA.jpg", description:{en:"Coral paradise.",ja:"サンゴ礁の楽園。"}, access:{en:"Direct flights."}, sights:{en:"Maehama Beach."}, tips:{en:"Snorkeling."}, official:"https://www.miyakotravel.jp/", group:"miyako" }
    };
    const islandsData = {
      yaeyama: { name:{en:"Nearby Islands of Ishigaki",ja:"石垣島周辺の島々"}, subIslands:[{id:"iriomote",nameEn:"Iriomote",nameJa:"西表島"},{id:"taketomi",nameEn:"Taketomi",nameJa:"竹富島"},{id:"kohama",nameEn:"Kohama",nameJa:"小浜島"},{id:"kuro",nameEn:"Kuro",nameJa:"黒島"},{id:"hatoma",nameEn:"Hatoma",nameJa:"鳩間島"}] },
      miyako: { name:{en:"Nearby Islands of Miyako",ja:"宮古島周辺の島々"}, subIslands:[{id:"irrabu",nameEn:"Irabu",nameJa:"伊良部島"},{id:"shimoji",nameEn:"Shimoji",nameJa:"下地島"},{id:"ikema",nameEn:"Ikema",nameJa:"池間島"},{id:"kurima",nameEn:"Kurima",nameJa:"来間島"}] }
    };
    const detailsContent = {
      ishigaki: mainIslandsDetails.ishigaki, miyakoMain: mainIslandsDetails.miyakoMain,
      iriomote: { image:"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Iriomote_Island_View.jpg/640px-Iriomote_Island_View.jpg", description:{en:"Jungle and wild cat."}, access:{en:"30min boat."}, sights:{en:"Pinaisara Falls."}, tips:{en:"Insect repellent."}, official:"#" },
      taketomi: { image:"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Taketomi_Island_buffalo_cart.jpg/640px-Taketomi_Island_buffalo_cart.jpg", description:{en:"Water buffalo carts."}, access:{en:"15min ferry."}, sights:{en:"Kondoi Beach."}, tips:{en:"Rent a bike."}, official:"#" },
      kohama: { image:"https://upload.wikimedia.org/wikipedia/commons/1/1f/Kohama_Island_01.jpg", description:{en:"Sugarcane fields."}, access:{en:"25min ferry."}, sights:{en:"Sugar Road."}, tips:{en:"Cycling."}, official:"#" },
      kuro: { image:"https://upload.wikimedia.org/wikipedia/commons/0/0f/Kuroshima_Island_-_pasture.jpg", description:{en:"Cows and stars."}, access:{en:"25min ferry."}, sights:{en:"Aiyaruhama Beach."}, tips:{en:"Ebike."}, official:"#" },
      hatoma: { image:"https://upload.wikimedia.org/wikipedia/commons/9/95/Hatoma_Island.jpg", description:{en:"Tiny remote island."}, access:{en:"40min ferry."}, sights:{en:"Hatoma Beach."}, tips:{en:"No store."}, official:"#" },
      irrabu: { image:"https://upload.wikimedia.org/wikipedia/commons/f/fb/Irabu_Ohashi_Bridge.jpg", description:{en:"Irabu Bridge views."}, access:{en:"Drive from Miyako."}, sights:{en:"Toguchi Beach."}, tips:{en:"Sunset drive."}, official:"#" },
      shimoji: { image:"https://upload.wikimedia.org/wikipedia/commons/0/0c/Shimoji_Island_airport.jpg", description:{en:"Clear waters."}, access:{en:"Via Irabu."}, sights:{en:"Toriike Pond."}, tips:{en:"Snorkeling gear."}, official:"#" },
      ikema: { image:"https://upload.wikimedia.org/wikipedia/commons/8/87/Ikema_Island_Ohashi.jpg", description:{en:"Pastoral landscape."}, access:{en:"Ikema Bridge."}, sights:{en:"Ikema Beach."}, tips:{en:"E-bike."}, official:"#" },
      kurima: { image:"https://upload.wikimedia.org/wikipedia/commons/6/6a/Kurima_Bridge.jpg", description:{en:"Panoramic views."}, access:{en:"Kurima Bridge."}, sights:{en:"Kurima Beach."}, tips:{en:"Walking."}, official:"#" }
    };

    function t(key) { return translations[currentLang][key] || key; }
    function getName(obj, fallback) { return obj[currentLang] || obj.en || fallback; }

    let currentView = "main", currentGroup = null, currentDetailId = null, deferredPrompt;

    function render() {
      const app = document.getElementById("app");
      if (currentView === "main") {
        app.innerHTML = `
          <h2 style="text-align:center">${t("mainPageTitle")}</h2>
          <div class="card-grid">
            <div class="card" data-detail="ishigaki">
              <h3>${getName(mainIslandsDetails.ishigaki.name, "Ishigaki")}</h3>
              <img class="main-island-img" src="${mainIslandsDetails.ishigaki.image}" onerror="this.src='https://placehold.co/600x300?text=Ishigaki'">
              <p>${getName(mainIslandsDetails.ishigaki.description, "")}</p>
              <div class="map-preview">${ISHIGAKI_MAP_URL ? `<iframe src="${ISHIGAKI_MAP_URL}"></iframe>` : `<div class="map-placeholder">${t("noMap")}</div>`}</div>
              <a href="${mainIslandsDetails.ishigaki.official}" target="_blank" class="official-btn" onclick="event.stopPropagation()">${t("officialWebsite")}</a>
              <button class="detail-btn">${t("detailsButton")}</button>
            </div>
            <div class="card" data-detail="miyakoMain">
              <h3>${getName(mainIslandsDetails.miyakoMain.name, "Miyako")}</h3>
              <img class="main-island-img" src="${mainIslandsDetails.miyakoMain.image}" onerror="this.src='https://placehold.co/600x300?text=Miyako'">
              <p>${getName(mainIslandsDetails.miyakoMain.description, "")}</p>
              <div class="map-preview">${MIYAKO_MAP_URL ? `<iframe src="${MIYAKO_MAP_URL}"></iframe>` : `<div class="map-placeholder">${t("noMap")}</div>`}</div>
              <a href="${mainIslandsDetails.miyakoMain.official}" target="_blank" class="official-btn" onclick="event.stopPropagation()">${t("officialWebsite")}</a>
              <button class="detail-btn">${t("detailsButton")}</button>
            </div>
          </div>
          <div class="button-group">
            <button id="gotoYaeyamaGroup" class="group-btn">${t("nearIslandsBtn")}</button>
            <button id="gotoMiyakoGroup" class="group-btn">${t("nearMiyakoBtn")}</button>
          </div>
        `;
        document.querySelectorAll(".card").forEach(card => {
          const detailId = card.dataset.detail;
          const gotoDetail = () => { currentDetailId = detailId; currentView = "detail"; render(); };
          card.addEventListener("click", gotoDetail);
          card.querySelector(".detail-btn")?.addEventListener("click", (e) => { e.stopPropagation(); gotoDetail(); });
        });
        document.getElementById("gotoYaeyamaGroup")?.addEventListener("click", () => { currentGroup = "yaeyama"; currentView = "group"; render(); });
        document.getElementById("gotoMiyakoGroup")?.addEventListener("click", () => { currentGroup = "miyako"; currentView = "group"; render(); });
      } else if (currentView === "group") {
        const group = islandsData[currentGroup];
        app.innerHTML = `<button class="back-btn" id="backMainFromGroup">← ${t("backToMain")}</button><h2 style="text-align:center">${getName(group.name, currentGroup)}</h2><div class="island-list">${group.subIslands.map(sub => `<div class="list-item" data-id="${sub.id}">${getName({ en: sub.nameEn, ja: sub.nameJa }, sub.id)}</div>`).join('')}</div>`;
        document.getElementById("backMainFromGroup")?.addEventListener("click", () => { currentView = "main"; render(); });
        document.querySelectorAll(".list-item").forEach(el => { el.addEventListener("click", () => { currentDetailId = el.dataset.id; currentView = "detail"; render(); }); });
      } else if (currentView === "detail") {
        const d = detailsContent[currentDetailId];
        if (!d) { currentView = "main"; render(); return; }
        app.innerHTML = `<div class="detail-view"><button class="back-btn" id="backMainFromDetail">← ${t("backToMain")}</button><h2>${getName(d.name || { en: currentDetailId }, currentDetailId)}</h2><img class="detail-img" src="${d.image}" onerror="this.src='https://placehold.co/600x300'"><p><strong>📖 Description:</strong> ${d.description?.[currentLang] || d.description?.en || ""}</p><p><strong>🚢 Access:</strong> ${d.access?.[currentLang] || d.access?.en || ""}</p><p><strong>🏖️ Sights:</strong> ${d.sights?.[currentLang] || d.sights?.en || ""}</p><p><strong>💡 Tips:</strong> ${d.tips?.[currentLang] || d.tips?.en || ""}</p><p><strong>🔗 Official:</strong> <a href="${d.official || "#"}" target="_blank">${d.official || "#"}</a></p><button class="back-btn" id="backMainFromDetailBottom">← ${t("backToMain")}</button></div>`;
        const goMain = () => { currentView = "main"; render(); };
        document.getElementById("backMainFromDetail")?.addEventListener("click", goMain);
        document.getElementById("backMainFromDetailBottom")?.addEventListener("click", goMain);
      }
      updateSponsorDisplay();
      document.getElementById("main-title").innerText = t("title");
    }

    function updateSponsorDisplay() {
      const hasSponsor = SPONSOR_IMG_URL && SPONSOR_SITE_URL;
      document.getElementById("sponsorContentTop").innerHTML = hasSponsor ? `<img class="sponsor-img" src="${SPONSOR_IMG_URL}"><br><a class="sponsor-link" href="${SPONSOR_SITE_URL}" target="_blank">${SPONSOR_SITE_URL}</a>` : `<span>${t("sponsorDefault")}<br><small>Edit SPONSOR_IMG_URL and SPONSOR_SITE_URL</small></span>`;
      document.getElementById("sponsorContentBottom").innerHTML = hasSponsor ? `<img class="sponsor-img" src="${SPONSOR_IMG_URL}"><br><a class="sponsor-link" href="${SPONSOR_SITE_URL}" target="_blank">Visit Sponsor</a>` : `<span>${t("sponsorDefault")}</span>`;
    }

    function setLang(lang) { currentLang = lang; render(); }
    document.getElementById("langEN")?.addEventListener("click", () => setLang("en"));
    document.getElementById("langIT")?.addEventListener("click", () => setLang("it"));
    document.getElementById("langRU")?.addEventListener("click", () => setLang("ru"));
    document.getElementById("langJA")?.addEventListener("click", () => setLang("ja"));

    const body = document.body;
    if (localStorage.getItem("theme") === "light") { body.classList.remove("dark"); body.classList.add("light"); }
    else body.classList.add("dark");
    document.getElementById("themeToggle")?.addEventListener("click", () => {
      if (body.classList.contains("dark")) { body.classList.remove("dark"); body.classList.add("light"); localStorage.setItem("theme", "light"); }
      else { body.classList.remove("light"); body.classList.add("dark"); localStorage.setItem("theme", "dark"); }
    });

    // PWA インストール ー 完全に動作保証する処理
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById("installApp");
      if (installBtn) {
        installBtn.style.display = "inline-flex";
        installBtn.onclick = async () => {
          installBtn.style.display = "none";
          if (deferredPrompt) {
            await deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
          }
        };
      }
      console.log("✅ beforeinstallprompt fired - PWA installable");
    });
    
    window.addEventListener("appinstalled", () => {
      console.log("✅ App installed successfully");
      const installBtn = document.getElementById("installApp");
      if (installBtn) installBtn.style.display = "none";
    });

    // Service Worker 登録（確実に）
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then(reg => {
          console.log("✅ Service Worker registered with scope:", reg.scope);
        }).catch(err => {
          console.error("❌ Service Worker registration failed:", err);
        });
      });
    } else {
      console.warn("⚠️ Service Worker not supported");
    }

    // インストール条件をチェック（デバッグ）
    if (window.matchMedia('(display-mode: standalone)').matches) {
      console.log("✅ App running in standalone (installed) mode");
    } else {
      console.log("ℹ️ App running in browser. Check: HTTPS? Valid manifest? SW registered? User engagement?");
    }

    render();
  </script>
</body>
</html>
