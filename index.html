<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Yaeyama & Miyako Islands Guide</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e2a3a">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.2s;
    }

    body.dark {
      --bg: #121212;
      --surface: #1e2a3a;
      --text: #eef2f5;
      --text-secondary: #b0c4de;
      --border: #2d3e4e;
      --card-bg: #1e2a3a;
      --btn-bg: #2d3e4e;
      --input-bg: #2d3e4e;
    }
    body.light {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --text: #1e2a3a;
      --text-secondary: #2c3e50;
      --border: #ccd7e4;
      --card-bg: #ffffff;
      --btn-bg: #e9edf2;
      --input-bg: #ffffff;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      padding: 0 16px;
    }

    header, footer {
      background-color: var(--surface);
      padding: 16px;
      border-radius: 20px;
      margin: 16px 0;
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 12px;
    }

    .lang-btn, .theme-btn, .install-btn {
      background-color: var(--btn-bg);
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 40px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .sponsor-area {
      background-color: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 20px;
      padding: 16px;
      margin: 20px 0;
      text-align: center;
    }
    .sponsor-edit {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      justify-content: center;
    }
    .sponsor-edit input {
      padding: 8px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      flex: 1;
      min-width: 180px;
    }
    button {
      background-color: var(--btn-bg);
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      color: var(--text);
      cursor: pointer;
    }
    .sponsor-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .sponsor-img {
      max-width: 100%;
      max-height: 80px;
      border-radius: 12px;
    }
    .sponsor-link {
      color: #4a9eff;
      text-decoration: none;
    }

    .card-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin: 20px 0;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 20px;
      width: 300px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .main-island-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 20px;
      margin: 12px 0;
    }
    .official-btn {
      display: inline-block;
      margin-top: 12px;
      background-color: #2c6e9e;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.9rem;
    }
    .island-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
    }
    .list-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 14px 20px;
      cursor: pointer;
      font-weight: bold;
    }
    .detail-view {
      background: var(--card-bg);
      border-radius: 32px;
      padding: 24px;
      max-width: 800px;
      margin: 0 auto;
    }
    .detail-img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 24px;
      margin: 16px 0;
    }
    .back-btn {
      margin-top: 30px;
      display: inline-block;
    }
    footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }
    hr {
      border-color: var(--border);
      margin: 12px 0;
    }
    /* 地図URLセクションのスタイル */
    .map-url-section {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .map-url-section input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 40px;
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      color: var(--text);
      margin-bottom: 8px;
      font-size: 0.85rem;
    }
    .map-url-section .save-map-url {
      font-size: 0.8rem;
      padding: 5px 12px;
      margin-right: 8px;
    }
    .map-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.85rem;
      background-color: #2c6e9e;
      color: white;
      padding: 6px 12px;
      border-radius: 40px;
      text-decoration: none;
    }
    .map-link:hover {
      opacity: 0.9;
    }
    .card .detail-btn {
      margin-top: 8px;
    }
    @media (max-width: 640px) {
      body { padding: 0 12px; }
      .card { width: 100%; }
    }
  </style>
</head>

              <p>${getName(mainIslandsDetails.ishigaki.description, "Gateway to Yaeyama islands.")}</p>
              <a href="${mainIslandsDetails.ishigaki.official}" target="_blank" class="official-btn" onclick="event.stopPropagation()">${t("officialWebsite")}</a>
              <!-- 地図URL設定セクション -->
              <div class="map-url-section" onclick="event.stopPropagation()">
                <input type="text" id="mapUrlInput_ishigaki" placeholder="${t("mapUrlPlaceholder")}" value="${escapeHtml(ishigakiMapUrl)}">
                <button class="save-map-url" data-id="ishigaki">${t("saveMapUrl")}</button>
                ${ishigakiMapUrl ? `<a href="${escapeHtml(ishigakiMapUrl)}" target="_blank" class="map-link" onclick="event.stopPropagation()">${t("viewMap")}</a>` : ''}
              </div>
              <div style="margin-top:12px"><button class="detail-btn">${t("detailsButton")}</button></div>
            </div>
            <div class="card" data-detail="miyakoMain">
              <h3>${getName(mainIslandsDetails.miyakoMain.name, "Miyako")}</h3>
              <img class="main-island-img" src="${mainIslandsDetails.miyakoMain.image}" alt="Miyako" onerror="this.src='https://placehold.co/600x300?text=Miyako'">
              <p>${getName(mainIslandsDetails.miyakoMain.description, "Coral paradise.")}</p>
              <a href="${mainIslandsDetails.miyakoMain.official}" target="_blank" class="official-btn" onclick="event.stopPropagation()">${t("officialWebsite")}</a>
              <div class="map-url-section" onclick="event.stopPropagation()">
                <input type="text" id="mapUrlInput_miyakoMain" placeholder="${t("mapUrlPlaceholder")}" value="${escapeHtml(miyakoMapUrl)}">
                <button class="save-map-url" data-id="miyakoMain">${t("saveMapUrl")}</button>
                ${miyakoMapUrl ? `<a href="${escapeHtml(miyakoMapUrl)}" target="_blank" class="map-link" onclick="event.stopPropagation()">${t("viewMap")}</a>` : ''}
              </div>
              <div style="margin-top:12px"><button class="detail-btn">${t("detailsButton")}</button></div>
            </div>
          </div>
          <hr>
          <div style="text-align:center; margin: 20px 0 10px;">
            <h3>🔍 Explore Nearby Islands</h3>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:16px; margin-top:12px;">
              <button id="gotoYaeyamaGroup" style="background:#2c6e9e;">🏝️ Ishigaki's Nearby Islands (Yaeyama)</button>
              <button id="gotoMiyakoGroup" style="background:#2c6e9e;">🏝️ Miyako's Nearby Islands</button>
            </div>
          </div>
        `;
        
        // カードクリックで詳細へ
        document.querySelectorAll(".card").forEach(card => {
          const detailId = card.dataset.detail;
          const detailBtn = card.querySelector(".detail-btn");
          const gotoDetail = () => {
            currentDetailId = detailId;
            currentView = "detail";
            render();
          };
          card.addEventListener("click", gotoDetail);
          if (detailBtn) detailBtn.addEventListener("click", (e) => { e.stopPropagation(); gotoDetail(); });
        });
        
        // 地図URL保存ボタンのイベント
        document.querySelectorAll(".save-map-url").forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const islandId = btn.getAttribute("data-id");
            const input = document.getElementById(`mapUrlInput_${islandId}`);
            if (input) {
              const newUrl = input.value.trim();
              setMapUrl(islandId, newUrl);
              render(); // 再描画してリンク表示を更新
            }
          });
        });
        
        document.getElementById("gotoYaeyamaGroup")?.addEventListener("click", () => {
          currentGroup = "yaeyama";
          currentView = "group";
          render();
        });
        document.getElementById("gotoMiyakoGroup")?.addEventListener("click", () => {
          currentGroup = "miyako";
          currentView = "group";
          render();
        });
      } 
      else if (currentView === "group") {
        const group = islandsData[currentGroup];
        const subList = group.subIslands;
        app.innerHTML = `
          <button class="back-btn" id="backMainFromGroup">← ${t("backToMain")}</button>
          <h2 style="text-align:center">${getName(group.name, currentGroup)}</h2>
          <div class="island-list">
            ${subList.map(sub => `<div class="list-item" data-id="${sub.id}">${getName({ en: sub.nameEn, ja: sub.nameJa, it: sub.nameIt, ru: sub.nameRu }, sub.id)}</div>`).join('')}
          </div>
        `;
        document.getElementById("backMainFromGroup")?.addEventListener("click", () => {
          currentView = "main";
          render();
        });
        document.querySelectorAll(".list-item").forEach(el => {
          el.addEventListener("click", () => {
            currentDetailId = el.dataset.id;
            currentView = "detail";
            render();
          });
        });
      }
      else if (currentView === "detail") {
        const d = detailsContent[currentDetailId];
        if (!d) { currentView = "main"; render(); return; }
        const desc = d.description?.[currentLang] || d.description?.en || "";
        const access = d.access?.[currentLang] || d.access?.en || "";
        const sights = d.sights?.[currentLang] || d.sights?.en || "";
        const tips = d.tips?.[currentLang] || d.tips?.en || "";
        const officialUrl = d.official || "#";
        app.innerHTML = `
          <div class="detail-view">
            <button class="back-btn" id="backMainFromDetail">← ${t("backToMain")}</button>
            <h2>${getName(d.name || { en: currentDetailId }, currentDetailId)}</h2>
            <img class="detail-img" src="${d.image}" alt="${currentDetailId}" onerror="this.src='https://placehold.co/600x300?text=Image+not+found'">
            <p><strong>📖 Description:</strong> ${desc}</p>
            <p><strong>🚢 Access:</strong> ${access}</p>
            <p><strong>🏖️ Sights / Beach:</strong> ${sights}</p>
            <p><strong>💡 Travel Tips:</strong> ${tips}</p>
            <p><strong>🔗 Official site:</strong> <a href="${officialUrl}" target="_blank">${officialUrl}</a></p>
            <button class="back-btn" id="backMainFromDetailBottom">← ${t("backToMain")}</button>
          </div>
        `;
        const goMain = () => { currentView = "main"; render(); };
        document.getElementById("backMainFromDetail")?.addEventListener("click", goMain);
        document.getElementById("backMainFromDetailBottom")?.addEventListener("click", goMain);
      }
      updateSponsorDisplay();
      document.getElementById("main-title").innerText = t("title");
    }
    
    // XSS対策簡易エスケープ
    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
        return c;
      });
    }

    // スポンサー機能 (変更なし)
    function updateSponsorDisplay() {
      const imgUrl = localStorage.getItem("sponsorImg") || "";
      const siteUrl = localStorage.getItem("sponsorUrl") || "";
      const htmlTop = imgUrl ? `<img class="sponsor-img" src="${imgUrl}" alt="sponsor"><br><a class="sponsor-link" href="${siteUrl}" target="_blank">${siteUrl}</a>` : `<span>${t("sponsorDefault")}<br><small>Set image & URL above</small></span>`;
      const htmlBottom = imgUrl ? `<img class="sponsor-img" src="${imgUrl}" alt="sponsor"><br><a class="sponsor-link" href="${siteUrl}" target="_blank">Visit Sponsor</a>` : `<span>${t("sponsorDefault")}</span>`;
      document.getElementById("sponsorContentTop").innerHTML = htmlTop;
      document.getElementById("sponsorContentBottom").innerHTML = htmlBottom;
    }
    document.getElementById("saveSponsor")?.addEventListener("click", () => {
      localStorage.setItem("sponsorImg", document.getElementById("sponsorImgUrl").value);
      localStorage.setItem("sponsorUrl", document.getElementById("sponsorSiteUrl").value);
      updateSponsorDisplay();
    });
    function loadSponsorFromStorage() {
      document.getElementById("sponsorImgUrl").value = localStorage.getItem("sponsorImg") || "";
      document.getElementById("sponsorSiteUrl").value = localStorage.getItem("sponsorUrl") || "";
      updateSponsorDisplay();
    }

    // 言語切り替え
    function setLang(lang) { currentLang = lang; render(); loadSponsorFromStorage(); }
    document.getElementById("langEN")?.addEventListener("click", () => setLang("en"));
    document.getElementById("langIT")?.addEventListener("click", () => setLang("it"));
    document.getElementById("langRU")?.addEventListener("click", () => setLang("ru"));
    document.getElementById("langJA")?.addEventListener("click", () => setLang("ja"));

    // テーマ切り替え
    const body = document.body;
    const themeToggle = document.getElementById("themeToggle");
    if (localStorage.getItem("theme") === "light") { body.classList.remove("dark"); body.classList.add("light"); }
    else body.classList.add("dark");
    themeToggle?.addEventListener("click", () => {
      if (body.classList.contains("dark")) {
        body.classList.remove("dark"); body.classList.add("light");
        localStorage.setItem("theme", "light");
      } else {
        body.classList.remove("light"); body.classList.add("dark");
        localStorage.setItem("theme", "dark");
      }
    });

    // PWA インストール
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById("installApp");
      if (installBtn) installBtn.style.display = "inline-flex";
      installBtn?.addEventListener("click", async () => {
        installBtn.style.display = "none";
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
      });
    });

    // Service Worker 登録
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then(reg => console.log("SW registered:", reg)).catch(err => console.log("SW failed:", err));
      });
    }

    loadSponsorFromStorage();
    render();
  </script>
</body>
</html>
